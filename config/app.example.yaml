# Non-secret application configuration. Copy to config/app.yaml and edit.
# Secrets belong in .env only (see .env.example).

speech:
  voices_dir: config/voices
  users_config: config/users.yaml
  output_dir: var/speech

  tts_model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  tts_device: cuda
  tts_dtype: bfloat16
  tts_attn_implementation: sdpa  # sdpa everywhere; flash_attention_2 where supported
  tts_fast: true                 # faster-qwen3-tts (CUDA graphs); falls back to stock Qwen3-TTS on failure
  tts_stream_chunk_size: 8       # codec frames per streamed chunk (12.5 frames/s)
  max_concurrent_inference: 1
  queue_size: 8
  warmup_on_start: false

  # Failed speech jobs keep their intermediate WAVs for diagnosis; job dirs
  # older than this many hours are pruned when the next job starts.
  failed_job_retention_hours: 24.0

  sample_rate_hz: 48000
  channels: 2
  default_speed: 1.0
  default_target_peak_dbfs: -1.0

  # Generated song commentary via the speech pipeline (text from the content
  # provider below, or a static template when content is disabled).
  # Review Round-2 P1: the commentary flow is the primary feature — on by default.
  commentary_enabled: true

  # Voice-conversion backends the router may serve. Voice profiles
  # (config/voices/*.yaml) select the backend per profile via
  # voice_conversion.backend: passthrough | rvc. Requesting an unknown or
  # disabled backend fails with a clear error (no silent fallback).
  voice_conversion_backends: [passthrough, rvc]
  # Behavior when a profile asks for 'rvc' but the RVC worker is unavailable
  # (no GPU, missing worker runtime):
  #   error       -> commentary generation is skipped; playback continues
  #   passthrough -> emit the un-converted source voice with a warning
  rvc_unavailable_policy: error

  # Config-selectable override of the RVC f0 extraction method carried by the
  # model YAMLs (rvc_cli/models/*/). The shipped yamls use `harvest` — the
  # slow CPU pitch extractor. `pm` (parselmouth) is the fast option
  # (typically 3-10x faster); `crepe`/`crepe-tiny` run on the GPU. null keeps
  # the profile yaml value (no silent quality change).
  voice_conversion:
    f0_method_override: null          # null | pm | harvest | dio | crepe | crepe-tiny | rmvpe
    # Opt-in streaming RVC: convert the TTS stream block by block (first audio
    # in ~250 ms) instead of whole sentences. Needs the rvc backend; f0 is
    # forced to pm for streams. All *_ms values are multiples of 20.
    # streaming: false
    # stream_first_block_ms: 100
    # stream_block_ms: 320
    # stream_context_ms: 1000
    # stream_lookahead_ms: 100
    # stream_crossfade_ms: 40
    # stream_search_ms: 20
    #
    # RVC output-quality knobs (docs/RVC_QUALITY_PLAN.md). All default to the
    # old behaviour. use_index / auto_pitch / rmvpe need the RVC quality work
    # in the worker and the RMVPE weights (rmvpe.pt, one-time download).
    # use_index: false               # retrieve from the model's faiss index
    # index_rate: null               # 0..1 index blend; null = model yaml value
    # index_nprobe: null             # 1..256 faiss probes; null = index default
    # protect: null                  # 0..0.5 consonant/breath protection; null = off
    # rms_mix_rate: null             # 0..1 loudness-envelope mix; null = off (1.0)
    # pitch_shift_offset: 0          # -24..24 semitones added to each profile's shift
    # auto_pitch: false              # shift source toward target_f0_median_hz per utterance
    # auto_pitch_strength: 1.0       # 0..1 fraction of the computed shift applied
    # auto_pitch_max: 12             # 0..24 max |semitones| of the automatic shift
    # target_f0_median_hz: {Obama: 108, Goku: 145}  # RVC model name -> Hz (40..600, case-insensitive)
    # f0_post_median: 0              # f0 median filter width: 0 (off) or odd >= 3
    # f0_post_octave_repair: false   # fix octave jumps in the f0 track
    # f0_post_clamp: null            # [min_hz, max_hz] f0 clamp, e.g. [50, 500]
    # stream_f0_algo: pm             # pm | rmvpe, f0 tracker for streaming RVC

# Local content generation (Phase F). Fully offline: no LLM API key needed.
# persona/style come from config/voices/*.yaml (persona.description).
content:
  enabled: true                        # loads Qwen3-4B on the GPU at startup
  provider: local_qwen                 # local_qwen | static
  model_id: Qwen/Qwen3-4B-Instruct-2507
  device: cuda
  dtype: bfloat16
  attn_implementation: sdpa
  max_new_tokens: 120
  temperature: 0.8
  system_prompt: ""                    # empty -> built-in radio-host prompt

# Reddit fetching (optional extra: pip install 'notamusicbot-goku[reddit]').
# Credentials live in .env (REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET).
reddit:
  subreddits: []                       # empty -> legacy behavior: front page
  post_limit: 40

# Randomized news/reddit interstitial between songs (legacy bot_manager
# behavior). Off by default; enable explicitly.
interstitial:
  enabled: false
  probability: 0.25                    # chance per finished song
  min_interval_s: 300                  # never more often than this
  voice_profile: goku                  # voice that reads the interstitial
  news_country: us
  news_category: null

# Two-voice podcast conversation mode (!gpodcast start|stop).
podcast:
  enabled: false
  host_profile: obama                  # voice profile id of the host persona
  reply_turns: 2                       # guest/host replies after the host opening (total lines = reply_turns + 1)

# Voice listen mode (!glisten start|on|off|stop|status). Off by default, and an
# empty allowed_channel_ids refuses to start even when enabled. Only users who
# type `!glisten on` are decoded or transcribed; user audio never touches disk.
listen:
  enabled: false
  allowed_channel_ids: []              # empty => listen refuses to start
  operator_user_ids: []                # empty => guild administrators only
  voice_profile: goku
  announce_on_join: true
  announcement_text: "Heads up, I'm listening now. Only people who type listen on get transcribed, and nothing is saved."
  respond_to: all                      # all | wake_word
  wake_word: goku
  follow_up_window_s: 8.0              # wake_word mode: reply without it this soon after the bot spoke
  vad:
    backend: silero                    # silero | energy
    threshold: 0.5
    min_speech_ms: 250
    end_silence_ms: 600                # must be >= min_speech_ms
    max_utterance_s: 15.0
    pre_roll_ms: 300
    ring_buffer_s: 30.0
  asr:
    backend: parakeet_onnx             # parakeet_onnx (CPU) | whisper_hf (GPU fallback)
    model_id: istupakov/parakeet-tdt-0.6b-v2-onnx   # parakeet_onnx, local HF cache only
    whisper_model_id: openai/whisper-small.en       # whisper_hf, local HF cache only
    device: cpu                        # cpu | cuda
    threads: 4                         # onnxruntime intra-op threads (>= 1)
    quantization: int8                 # int8 | fp32
    language: en
    timeout_s: 10.0
  reply:
    max_sentences: 2
    max_new_tokens: 60
    backchannel_enabled: true
    backchannel_texts: ["Hm?", "Oh yeah?", "Let me think."]
    barge_in_min_speech_ms: 400
    per_user_cooldown_s: 2.0
    max_replies_per_minute: 12
    history_turns: 8                   # in memory only, cleared on stop
    llm_timeout_s: 20.0
    first_chunk_max_words: 8           # >= 3; short first chunk so TTS starts early
    later_chunk_max_words: 12          # >= 3
    tts_max_seconds_per_word: 1.0      # TTS length cap = max(floor, words * this)
    tts_cap_floor_seconds: 2.0
  llm:
    provider: spark                    # spark (owner's Spark via loopback tunnel) | local (in-process Qwen3-4B)
    base_url: http://127.0.0.1:8000/v1 # loopback only (127.0.0.1, ::1, localhost); anything else is rejected
    model: auto                        # auto = first id from GET /models; never hardcode an id
    timeout_s: 20.0
    first_token_timeout_s: 8.0
    fallback: local                    # local = lazy-load in-process Qwen3-4B if the Spark is down | none
    health_interval_s: 30.0
    hedge_after_s: null                # thinking low only: after N s with no content, race a thinking-off request (null/0 = off)
  privacy:
    log_transcripts: false             # DEBUG transcript lines only when true
    persist_opt_ins: false             # opt-ins last one session

discord:
  command_prefix: "!g"
  # Optional sound played on first voice-channel join per session.
  start_sound: null
  message_delete_delay_s: 1.0

media:
  yt_clients: [default, web, tv_embedded]
  cookies_file: input/youtube_cookies.txt   # optional; missing file = anonymous extraction
  cache_dir: var/cache/youtube              # per-run files, deleted after playback
  js_runtimes:
    deno: ~/.deno/bin/deno                  # discovered + registered for yt-dlp (yt_dlp_ejs)
