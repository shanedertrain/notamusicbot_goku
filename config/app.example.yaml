# Non-secret application configuration. Copy to config/app.yaml and edit.
# Secrets belong in .env only (see .env.example).

speech:
  voices_dir: config/voices
  users_config: config/users.yaml
  output_dir: var/speech

  tts_model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  tts_device: cuda
  tts_dtype: bfloat16
  tts_attn_implementation: sdpa  # sdpa everywhere; flash_attention_2 where supported
  max_concurrent_inference: 1
  queue_size: 8
  warmup_on_start: false

  sample_rate_hz: 48000
  channels: 2
  default_speed: 1.0
  default_target_peak_dbfs: -1.0

  # Generated song commentary via the speech pipeline (content provider lands
  # in Phase F; until then commentary text is a static template).
  commentary_enabled: false

discord:
  command_prefix: "!g"
  # Optional sound played on first voice-channel join per session.
  start_sound: null
  message_delete_delay_s: 1.0

media:
  yt_clients: [default, web, tv_embedded]
  cookies_file: input/youtube_cookies.txt   # optional; missing file = anonymous extraction
  cache_dir: var/cache/youtube              # per-run files, deleted after playback
  js_runtimes:
    deno: ~/.deno/bin/deno                  # discovered + registered for yt-dlp (yt_dlp_ejs)
