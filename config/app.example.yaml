# Non-secret application configuration. Copy to config/app.yaml and edit.
# Secrets belong in .env only (see .env.example).

speech:
  voices_dir: config/voices
  users_config: config/users.yaml
  output_dir: var/speech

  tts_model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  tts_device: cuda
  tts_dtype: bfloat16
  tts_attn_implementation: sdpa  # sdpa everywhere; flash_attention_2 where supported
  max_concurrent_inference: 1
  queue_size: 8
  warmup_on_start: false

  sample_rate_hz: 48000
  channels: 2
  default_speed: 1.0
  default_target_peak_dbfs: -1.0

  # Generated song commentary via the speech pipeline (text from the content
  # provider below, or a static template when content is disabled).
  commentary_enabled: false

  # Voice-conversion backends the router may serve. Voice profiles
  # (config/voices/*.yaml) select the backend per profile via
  # voice_conversion.backend: passthrough | rvc. Requesting an unknown or
  # disabled backend fails with a clear error (no silent fallback).
  voice_conversion_backends: [passthrough, rvc]
  # Behavior when a profile asks for 'rvc' but the RVC worker is unavailable
  # (no GPU, missing worker runtime):
  #   error       -> commentary generation is skipped; playback continues
  #   passthrough -> emit the un-converted source voice with a warning
  rvc_unavailable_policy: error

# Local content generation (Phase F). Fully offline: no LLM API key needed.
# persona/style come from config/voices/*.yaml (persona.description).
content:
  enabled: false                       # true -> load Qwen3-4B on the GPU at startup
  provider: local_qwen                 # local_qwen | static
  model_id: Qwen/Qwen3-4B-Instruct-2507
  device: cuda
  dtype: bfloat16
  attn_implementation: sdpa
  max_new_tokens: 120
  temperature: 0.8
  max_concurrent_generations: 1        # single-threaded LLM generation
  system_prompt: ""                    # empty -> built-in radio-host prompt

discord:
  command_prefix: "!g"
  # Optional sound played on first voice-channel join per session.
  start_sound: null
  message_delete_delay_s: 1.0

media:
  yt_clients: [default, web, tv_embedded]
  cookies_file: input/youtube_cookies.txt   # optional; missing file = anonymous extraction
  cache_dir: var/cache/youtube              # per-run files, deleted after playback
  js_runtimes:
    deno: ~/.deno/bin/deno                  # discovered + registered for yt-dlp (yt_dlp_ejs)
