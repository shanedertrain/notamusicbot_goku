[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notamusicbot-goku"
version = "0.2.0"
description = "Discord music bot with Qwen3-TTS speech pipeline, voice conversion, and media playback."
requires-python = ">=3.12"
dependencies = [
    "qwen-tts",
    # Declared explicitly: application code (content/llm.py, speech/) imports
    # torch/transformers directly, not only via qwen-tts's transitive graph.
    "torch>=2.6",
    "transformers>=4.55",
    "soundfile>=0.12",
    "soxr>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4", "PyNaCl>=1.5"]
media = ["yt-dlp", "yt-dlp-ejs>=0.8", "spotipy>=2.24"]
reddit = ["praw>=7.7"]
# Voice listen mode: silero VAD (ONNX, CPU) and onnx-asr (Parakeet, CPU). Optional;
# the energy VAD needs neither.
listen = ["silero-vad>=6.0", "onnx-asr>=0.12"]
# Also needed by listen mode but NOT expressible here: faster-qwen3-tts==0.3.1 (--no-deps)
# and onnxruntime-gpu==1.31.0 replacing onnxruntime. See DEPENDENCY_NOTES.md.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.11"]

[project.scripts]
speech-test = "notamusicbot.tools.speech_test:main"
benchmark-voices = "notamusicbot.tools.benchmark_voices:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notamusicbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services or model weights",
    "gpu: requires CUDA hardware",
    "rvc: requires legacy RVC models/environment",
    "network: requires internet access",
]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    ".venv-main",
    "backups",
    "output",
    "logs",
    "input",
    "genai",
    "rvc_cli",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/notamusicbot"]
explicit_package_bases = true
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

# Third-party modules installed without stubs or a py.typed marker (no
# stubs distribution is available in this offline venv). Each entry is a
# targeted ignore_missing_imports only — no code suppression involved.
[[tool.mypy.overrides]]
# yaml: PyYAML ships no py.typed; types-PyYAML not installable offline.
# yt_dlp / yt_dlp_ejs: untyped upstream; no stub package exists.
# spotipy: untyped upstream.
# soundfile / soxr: C-extension audio libs, untyped.
# qwen_tts: internal-vendored TTS package, untyped.
module = [
    "yaml",
    "yt_dlp",
    "yt_dlp_ejs",
    "spotipy.*",
    "soundfile",
    "soxr",
    "qwen_tts",
]
ignore_missing_imports = true
