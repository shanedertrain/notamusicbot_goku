[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notamusicbot-goku"
version = "0.2.0"
description = "Discord music bot with Qwen3-TTS speech pipeline, voice conversion, and media playback."
requires-python = ">=3.12"
dependencies = [
    "qwen-tts",
    "soundfile>=0.12",
    "soxr>=0.5",
    "numpy>=1.26",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.4", "PyNaCl>=1.5"]
media = ["yt-dlp", "yt-dlp-ejs>=2025.10.14", "spotipy>=2.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.11"]

[project.scripts]
speech-test = "notamusicbot.tools.speech_test:main"
benchmark-voices = "notamusicbot.tools.benchmark_voices:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notamusicbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services or model weights",
    "gpu: requires CUDA hardware",
    "rvc: requires legacy RVC models/environment",
    "network: requires internet access",
]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    ".venv-main",
    "backups",
    "output",
    "logs",
    "input",
    "genai",
    "rvc_cli",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/notamusicbot"]
explicit_package_bases = true
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
