[tool.poetry]
name = "notamusicbot-goku"
version = "0.1.0"
description = "Discord music bot with TTS, RVC, Spotify/YouTube playback, and auxiliary generators."
authors = ["Professor"]
readme = "README.md"
package-mode = false

