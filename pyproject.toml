[tool.poetry.group.dev.dependencies]
# poethepoet removed for now to avoid PyYAML version conflict; re-add with a compatible PyYAML bump if needed.

[tool.poetry.scripts]
goku-bot = "main:main"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
